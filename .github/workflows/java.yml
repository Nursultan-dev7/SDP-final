name: Java verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and verify on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: test.cmd
      - name: Compile and verify on Linux
        if: runner.os != 'Windows'
        run: sh test.sh
      - name: Verify source and JAR hierarchy
        run: python docs/verify_structure.py
